name: Release Windows executable

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check release version
        run: |
          $version = python -c "from shelf_version import __version__; print(__version__)"
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "Tag must match shelf_version.py" }
          $notes = Get-Content -LiteralPath "release-notes/$env:GITHUB_REF_NAME.md" -Raw -ErrorAction Stop
          if ([string]::IsNullOrWhiteSpace($notes)) { throw "Release notes are empty for $env:GITHUB_REF_NAME" }
      - name: Run tests
        run: python run_tests.py
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3
      - name: Build executable
        run: python -m PyInstaller --noconfirm ReleaseShelf.spec
      - name: Publish executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "dist/ReleaseShelf.exe" --verify-tag --notes-file "release-notes/$env:GITHUB_REF_NAME.md" --title "ReleaseShelf $env:GITHUB_REF_NAME"
